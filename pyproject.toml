[project]
name = "llama-stack-provider-trustyai-garak"
version = "0.5.1"
description = "Garak red-teaming evaluation adapter for eval-hub"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "Sai Chandra Pandraju", email = "saichandrapandraju@gmail.com"},
    {name = "TrustyAI Team"}
]
keywords = ["garak", "red-teaming", "security", "ai-safety", "eval-hub"]
dependencies = [
    # Remote execution dependencies
    "kfp>=2.14.6",
    "kfp-kubernetes>=2.14.6",
    "kfp-server-api>=2.14.6",
    "boto3>=1.35.88",
    # eval-hub integration
    "eval-hub-sdk[adapter]~=1.0.4",
    "pandas>=2.3.3",
    "Jinja2>=3.1.6",
]

[project.urls]
homepage = "https://github.com/trustyai-explainability/llama-stack-provider-trustyai-garak"
repository = "https://github.com/trustyai-explainability/llama-stack-provider-trustyai-garak"

[build-system]
requires = [
    "setuptools>=80.9.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llama_stack_provider_trustyai_garak" = ["resources/*"]

[project.optional-dependencies]
sdg = [
    "nest_asyncio>=1.6.0",
    "sdg-hub~=0.9.4",
]
inline = [
    "llama-stack-provider-trustyai-garak[sdg]",
    "garak==0.17.1+rhaiv.1",
]
# eval-hub-server: the server binary the e2e tests run (tests/e2e); its version selects
# the eval-hub garak catalog the tests load. Install via scripts/install-locked-deps.sh --extras test.
test = ["pytest", "pytest-cov", "pytest-asyncio", "eval-hub-server==1.0.3"]
dev = ["llama-stack-provider-trustyai-garak[test]", "ruff", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-v"
markers = [
    "e2e: real eval-hub server + garak adapter + garak against a mock model (see tests/e2e/conftest.py)",
    "e2e_sweep: every taxonomy benchmark; needs E2E_SWEEP=capped (PRs) or E2E_SWEEP=full (nightly)",
]

[tool.coverage.run]
source = ["llama_stack_provider_trustyai_garak"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — enforced by formatter instead
    "W291",   # trailing whitespace — pre-existing, will clean up incrementally
    "W293",   # blank line with whitespace — pre-existing
    "F811",   # redefined-while-unused — some test fixtures
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = [
    "union-attr",
    "assignment",
    "no-any-return",
    "arg-type",
    "attr-defined",
    "valid-type",
    "no-redef",
    "call-arg",
    "var-annotated",
    "return-value",
    "index",
    "override",
]
