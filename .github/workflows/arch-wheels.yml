name: Wheels per architecture

# Downstream release builds cover x86_64, aarch64, ppc64le and s390x from the AIPCC index
# that requirements.txt names, but pull-request builds on main cover x86_64 and aarch64
# only. This checks that the index has a wheel of every locked version each architecture
# installs, so a missing ppc64le or s390x wheel shows up on the PR that changes the lock
# instead of in the release build. It also runs weekly, since the index's content can change under an unchanged lock.
# See scripts/check_arch_wheels.py.

on:
  pull_request:
    paths:
      - requirements.txt
      - constraints.txt
      - pyproject.toml
      - scripts/check_arch_wheels.py
      - .github/workflows/arch-wheels.yml
  push:
    branches: [main, 'rhoai-*']
    paths:
      - requirements.txt
      - constraints.txt
      - pyproject.toml
      - scripts/check_arch_wheels.py
      - .github/workflows/arch-wheels.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: AIPCC wheels for x86_64, aarch64, ppc64le, s390x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv and packaging (packaging at the locked version)
        run: python -m pip install --upgrade pip uv "$(grep -E '^packaging==' requirements.txt)"

      - name: Check the index for every architecture
        run: python scripts/check_arch_wheels.py requirements.txt
