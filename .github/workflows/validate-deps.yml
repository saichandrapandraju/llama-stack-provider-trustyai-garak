name: Validate Dependencies

# One file for upstream (trustyai-explainability), midstream (opendatahub-io) and downstream
# (red-hat-data-services): the syncs carry it unchanged, and each job says where it runs.
#
#   lock-check        everywhere, except same-repository PRs upstream (auto-sync covers those)
#   sync-requirements upstream same-repository PRs: commits the regenerated lock to the PR
#   container-build   upstream and midstream; downstream builds its image in Konflux, on the
#                     AIPCC base image, from the same lock
#   check-garak-drift upstream schedule, or a manual run anywhere; report-drift keeps the
#                     garak-drift issue current on scheduled runs
#
# The lock is resolved against the AIPCC index but never installed here: AIPCC packages are
# meant for AIPCC base images, which is what the downstream Konflux build installs them on.

on:
  pull_request:
    branches: [main, 'rhoai-*']
  push:
    branches: [main, 'rhoai-*']
  schedule:
    # Garak drift is about new fork tags, not PR content, so it runs on a schedule
    # instead of failing every open PR the moment a tag is pushed.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: Validate requirements.txt
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.repository_owner == 'trustyai-explainability')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          # A PR is checked at its head, so a failure reproduces on the contributor's branch.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        # `make lock` runs the uv version the Makefile pins (UV_VERSION) through uvx.
        run: python -m pip install --upgrade pip uv

      - name: Regenerate requirements.txt
        run: make lock

      - name: Compare with the committed requirements.txt
        run: |
          if ! git diff --exit-code -- requirements.txt; then
            echo "::error file=requirements.txt::requirements.txt does not match pyproject.toml and constraints.txt. Run 'make lock' and commit the result."
            exit 1
          fi

  sync-requirements:
    name: Auto-sync requirements.txt
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository_owner == 'trustyai-explainability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Regenerate requirements.txt
        run: make lock

      - name: Commit if changed
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --quiet requirements.txt && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: auto-sync requirements.txt from pyproject.toml"
          git push origin "HEAD:refs/heads/$PR_HEAD_REF"

  check-garak-drift:
    name: Check garak midstream version drift
    # The schedule only runs upstream; midstream/downstream get this file by sync.
    if: >-
      (github.event_name == 'schedule' && github.repository_owner == 'trustyai-explainability') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pinned: ${{ steps.versions.outputs.pinned }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the pinned garak version and the latest midstream tag
        id: versions
        run: |
          PYPROJECT_VER=$(grep -oP 'garak==\K[^\s"]+' pyproject.toml)
          LATEST_TAG=$(git ls-remote --tags \
            https://github.com/trustyai-explainability/garak.git \
            | grep 'refs/tags/v' \
            | grep -v '\^{}' \
            | sed 's|.*refs/tags/v||' \
            | sort -V \
            | tail -1)
          echo "pyproject.toml garak version: $PYPROJECT_VER"
          echo "Latest midstream tag: $LATEST_TAG"
          echo "pinned=$PYPROJECT_VER" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Compare pyproject.toml garak version with latest midstream tag
        env:
          PYPROJECT_VER: ${{ steps.versions.outputs.pinned }}
          LATEST_TAG: ${{ steps.versions.outputs.latest }}
        run: |
          if [ -z "$PYPROJECT_VER" ] || [ -z "$LATEST_TAG" ]; then
            echo "::error::Could not read the pinned garak version or the latest midstream tag."
            exit 1
          fi
          if [ "$PYPROJECT_VER" != "$LATEST_TAG" ]; then
            echo "::error::Garak version drift detected!"
            echo "  pyproject.toml pins: $PYPROJECT_VER"
            echo "  Latest midstream:    $LATEST_TAG"
            echo "Update pyproject.toml, regenerate requirements.txt, and commit."
            exit 1
          fi

          echo "Garak version is up-to-date with midstream."

  report-drift:
    name: Report garak drift
    # Scheduled runs only: keeps one open "garak-drift" issue while the pin lags the latest fork
    # tag (one comment per new pin/tag pair, not one per night) and closes it once the pin catches up.
    needs: check-garak-drift
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(fromJSON('["success", "failure"]'), needs.check-garak-drift.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: report-garak-drift
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Open, update or close the garak-drift issue
        uses: ./.github/actions/report-scheduled-run
        with:
          outcome: ${{ needs.check-garak-drift.result }}
          label: garak-drift
          label-description: The garak pin lags the latest trustyai garak fork tag
          title: >-
            ${{ needs.check-garak-drift.outputs.latest &&
            format('garak {0} is available (pinned: {1})', needs.check-garak-drift.outputs.latest, needs.check-garak-drift.outputs.pinned) ||
            'Scheduled garak drift check failing' }}
          # Both versions: a newer tag, or a bump that still trails it, updates the issue once.
          key: >-
            ${{ needs.check-garak-drift.outputs.latest &&
            format('{0} -> {1}', needs.check-garak-drift.outputs.pinned, needs.check-garak-drift.outputs.latest) || '' }}
          body: |
            The trustyai garak fork has a newer tag than the one this repo pins.

            - Pinned (`pyproject.toml`, `inline` extra): `${{ needs.check-garak-drift.outputs.pinned }}`
            - Latest fork tag: `${{ needs.check-garak-drift.outputs.latest }}`

            To bump: update the `garak==` pin in `pyproject.toml`, run `make lock`, and open a PR.
            Label the PR `run-nightly-e2e` so the full benchmark sweep runs against the new garak.
            This issue closes itself after the next scheduled run that finds no drift.

            If both versions above are empty, the check itself failed (e.g. the tag lookup); see the run.

  container-build:
    name: Container Build + Import Validation
    # Downstream builds its image in Konflux on the AIPCC base image instead.
    if: github.event_name != 'schedule' && github.repository_owner != 'red-hat-data-services'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build container image
        run: |
          docker build -f Containerfile -t provider-smoke-test:ci .

      - name: Verify full import chain
        run: |
          docker run --rm provider-smoke-test:ci bash -c "\
            python -c \"import numpy; print('numpy OK')\" && \
            python -c \"import pandas; print('pandas OK')\" && \
            python -c \"import garak; print('garak OK')\" && \
            python -c \"import sdg_hub; print('sdg-hub OK')\" && \
            python -c \"import llama_stack_provider_trustyai_garak; print('provider OK')\""

      - name: Verify garak version matches requirements.txt
        run: |
          EXPECTED=$(grep -oP '^garak==\K\S+' requirements.txt)
          INSTALLED=$(docker run --rm provider-smoke-test:ci python -c "from importlib.metadata import version; print(version('garak'))")
          echo "Expected: $EXPECTED"
          echo "Installed: $INSTALLED"
          if [ "$EXPECTED" != "$INSTALLED" ]; then
            echo "::error::Garak version mismatch! Containerfile installs $INSTALLED but requirements.txt locks $EXPECTED"
            exit 1
          fi
          echo "Garak version in container matches requirements.txt."
