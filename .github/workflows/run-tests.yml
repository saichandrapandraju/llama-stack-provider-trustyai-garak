name: Tier 1 - Unit Tests

on:
  pull_request:
    branches: [main, 'rhoai-*']
  push:
    branches: [main, 'rhoai-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies (requirements.txt, public indexes)
        run: |
          python -m pip install --upgrade pip
          PIP_EXTRA_ARGS=--no-cache-dir scripts/install-locked-deps.sh --extras test
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Smoke-test imports
        run: |
          python -c "import numpy; print('numpy OK')"
          python -c "import pandas; print('pandas OK')"
          python -c "import llama_stack_provider_trustyai_garak; print('provider OK')"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests -v -m "not e2e"
